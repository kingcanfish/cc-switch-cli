name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  HOMEBREW_TAP_REPO: kingcanfish/homebrew-tap

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64
          - os: macos-14
            platform: darwin-arm64
            target: aarch64-apple-darwin
            binary: cc-switch-cli
          # macOS x86_64
          - os: macos-14
            platform: darwin-x64
            target: x86_64-apple-darwin
            binary: cc-switch-cli
          # Windows x86_64
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            binary: cc-switch-cli.exe
          # Linux x86_64 - MUSL (recommended)
          - os: ubuntu-22.04
            platform: linux-x64-musl
            target: x86_64-unknown-linux-musl
            binary: cc-switch-cli
            use_cross: true
          # Linux x86_64 - GLIBC (fallback)
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            binary: cc-switch-cli
            use_cross: false
          # Linux ARM64 - MUSL (recommended)
          - os: ubuntu-22.04
            platform: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            binary: cc-switch-cli
            use_cross: true
          # Linux ARM64 - GLIBC (fallback)
          - os: ubuntu-22.04
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            binary: cc-switch-cli
            use_cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Linux dependencies (GLIBC x64)
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Build with cross
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Build with cargo
        if: matrix.use_cross != true
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-cli-${{ matrix.platform }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  # Create macOS universal binary
  universal-macos:
    name: Universal macOS Binary
    runs-on: macos-14
    needs: build
    steps:
      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: cc-switch-cli-darwin-arm64
          path: arm64

      - name: Download x64 binary
        uses: actions/download-artifact@v4
        with:
          name: cc-switch-cli-darwin-x64
          path: x64

      - name: Create universal binary
        run: |
          mkdir -p universal
          lipo -create -output universal/cc-switch-cli arm64/cc-switch-cli x64/cc-switch-cli
          chmod +x universal/cc-switch-cli
          file universal/cc-switch-cli

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-cli-darwin-universal
          path: universal/cc-switch-cli
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: [build, universal-macos]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: |
          ls -R artifacts/

      - name: Prepare release assets
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${RELEASE_TAG}"

          # macOS Universal
          if [ -f "artifacts/cc-switch-cli-darwin-universal/cc-switch-cli" ]; then
            tar -czf release-assets/cc-switch-cli-${VERSION}-darwin-universal.tar.gz \
              -C artifacts/cc-switch-cli-darwin-universal cc-switch-cli
          fi

          # macOS ARM64
          if [ -f "artifacts/cc-switch-cli-darwin-arm64/cc-switch-cli" ]; then
            tar -czf release-assets/cc-switch-cli-${VERSION}-darwin-arm64.tar.gz \
              -C artifacts/cc-switch-cli-darwin-arm64 cc-switch-cli
          fi

          # macOS x64
          if [ -f "artifacts/cc-switch-cli-darwin-x64/cc-switch-cli" ]; then
            tar -czf release-assets/cc-switch-cli-${VERSION}-darwin-x64.tar.gz \
              -C artifacts/cc-switch-cli-darwin-x64 cc-switch-cli
          fi

          # Windows
          if [ -f "artifacts/cc-switch-cli-windows-x64/cc-switch-cli.exe" ]; then
            cd artifacts/cc-switch-cli-windows-x64
            zip ../../release-assets/cc-switch-cli-${VERSION}-windows-x64.zip cc-switch-cli.exe
            cd ../..
          fi

          # Linux x64 - MUSL
          if [ -f "artifacts/cc-switch-cli-linux-x64-musl/cc-switch-cli" ]; then
            tar -czf release-assets/cc-switch-cli-${VERSION}-linux-x64-musl.tar.gz \
              -C artifacts/cc-switch-cli-linux-x64-musl cc-switch-cli
          fi

          # Linux x64 - GLIBC
          if [ -f "artifacts/cc-switch-cli-linux-x64/cc-switch-cli" ]; then
            tar -czf release-assets/cc-switch-cli-${VERSION}-linux-x64.tar.gz \
              -C artifacts/cc-switch-cli-linux-x64 cc-switch-cli
          fi

          # Linux ARM64 - MUSL
          if [ -f "artifacts/cc-switch-cli-linux-arm64-musl/cc-switch-cli" ]; then
            tar -czf release-assets/cc-switch-cli-${VERSION}-linux-arm64-musl.tar.gz \
              -C artifacts/cc-switch-cli-linux-arm64-musl cc-switch-cli
          fi

          # Linux ARM64 - GLIBC
          if [ -f "artifacts/cc-switch-cli-linux-arm64/cc-switch-cli" ]; then
            tar -czf release-assets/cc-switch-cli-${VERSION}-linux-arm64.tar.gz \
              -C artifacts/cc-switch-cli-linux-arm64 cc-switch-cli
          fi

          echo "=== Release assets ==="
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CC Switch CLI ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body: |
            ## CC Switch CLI ${{ env.RELEASE_TAG }}

            All-in-One Assistant for Claude Code, Codex & Gemini CLI

            ### 📦 下载 / Downloads

            | 平台 Platform | 文件 File |
            |---------------|-----------|
            | **macOS** (Universal) | `cc-switch-cli-${{ env.RELEASE_TAG }}-darwin-universal.tar.gz` |
            | **Windows** (x64) | `cc-switch-cli-${{ env.RELEASE_TAG }}-windows-x64.zip` |
            | **Linux** (x64 musl) | `cc-switch-cli-${{ env.RELEASE_TAG }}-linux-x64-musl.tar.gz` |
            | **Linux** (x64 glibc) | `cc-switch-cli-${{ env.RELEASE_TAG }}-linux-x64.tar.gz` |
            | **Linux** (ARM64 musl) | `cc-switch-cli-${{ env.RELEASE_TAG }}-linux-arm64-musl.tar.gz` |
            | **Linux** (ARM64 glibc) | `cc-switch-cli-${{ env.RELEASE_TAG }}-linux-arm64.tar.gz` |

            ### 🚀 快速安装

            **macOS / Linux:**
            ```bash
            tar -xzf cc-switch-cli-*.tar.gz
            chmod +x cc-switch-cli
            sudo mv cc-switch-cli /usr/local/bin/
            ```

            **Windows:**
            ```powershell
            # 解压 zip 后将 cc-switch-cli.exe 移动到 PATH 目录或直接运行
            ```

            💡 **macOS 提示**: 如遇 "无法验证开发者"，执行：`xattr -cr /usr/local/bin/cc-switch-cli`

            💡 **Linux 用户建议优先使用 `-musl` 版本（静态链接，无系统库依赖，兼容所有发行版）**
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Homebrew shas
        id: brew_shas
        run: |
          set -euo pipefail
          echo "macos_arm64=$(sha256sum release-assets/cc-switch-cli-${RELEASE_TAG}-darwin-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "macos_x64=$(sha256sum release-assets/cc-switch-cli-${RELEASE_TAG}-darwin-x64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_x64=$(sha256sum release-assets/cc-switch-cli-${RELEASE_TAG}-linux-x64-musl.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum release-assets/cc-switch-cli-${RELEASE_TAG}-linux-arm64-musl.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "Missing HOMEBREW_TAP_TOKEN secret." >&2
            exit 1
          fi

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap
          mkdir -p tap/Formula

          bash scripts/render-homebrew-formula.sh \
            "${RELEASE_TAG}" \
            "${{ steps.brew_shas.outputs.macos_arm64 }}" \
            "${{ steps.brew_shas.outputs.macos_x64 }}" \
            "${{ steps.brew_shas.outputs.linux_x64 }}" \
            "${{ steps.brew_shas.outputs.linux_arm64 }}" \
            > tap/Formula/cc-switch-cli.rb

          cd tap
          git add Formula/cc-switch-cli.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula unchanged."
            exit 0
          fi

          git -c user.name="cc-switch-cli release" -c user.email="actions@github.com" \
            commit -m "chore: update cc-switch-cli ${RELEASE_TAG}"
          git push
